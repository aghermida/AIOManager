name: Sync main with upstream

# main is a secondary/reserve branch: kept up to date with upstream/main but
# not built or deployed. The fork tracks and deploys from `beta` instead —
# see .github/workflows/docker.yml on the beta branch for the build+push
# automation, and CLAUDE.md for why.
on:
  schedule:
    # 05:00 Europe/Madrid. GitHub Actions cron is UTC-only (no DST), so this
    # is 03:00 UTC while Madrid is on CEST (UTC+2) and needs bumping to
    # '0 4 * * *' once Madrid switches back to CET (UTC+1) in late October.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync fork with upstream
        run: |
          # Paths this fork deletes on purpose even though upstream still
          # maintains them. Upstream editing one of these produces a
          # modify/delete conflict on every sync unless we resolve it here
          # by keeping the deletion. See AIOStreams/aiometadata forks for
          # the same convention.
          FORK_DELETED_UPSTREAM_FILES=(
            ".github/workflows/docker-publish.yml" # replaced by beta's own sync+build+push job
          )

          git remote add upstream https://github.com/Sonicx161/AIOManager.git
          git fetch upstream
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git merge upstream/main --no-edit; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            resolvable=true
            for f in "${conflicts[@]}"; do
              known=false
              for d in "${FORK_DELETED_UPSTREAM_FILES[@]}"; do
                [ "$f" = "$d" ] && known=true && break
              done
              if [ "$known" = true ]; then
                git rm -f "$f"
              else
                resolvable=false
              fi
            done

            if [ "$resolvable" = true ] && [ "${#conflicts[@]}" -gt 0 ]; then
              git commit --no-edit
            else
              git merge --abort
              echo "::error::Merge conflict syncing upstream/main into main. Resolve manually and merge via PR."
              exit 1
            fi
          fi
          git push origin main
